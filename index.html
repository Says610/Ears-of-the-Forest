<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
        </div>
        <h1 class="game-title">EARS OF THE FOREST</h1>
        <p class="game-subtitle">A Survival Horror Experience</p>
        
        <div class="loading-progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="loading-text" id="loading-text">Initializing...</div>
    </div>

    <!-- Storyboard Container -->
    <div id="storyboard-container" class="storyboard-container">
        <button id="skip-cutscene-btn">Skip Cutscene (ESC)</button>
        <div class="storyboard-progress">
            <div class="storyboard-progress-bar" id="storyboard-progress-bar"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Game UI -->
    <div id="game-ui"></div>

    <!-- Visual Effects -->
    <div class="damage-flash" id="damage-flash"></div>
    <div class="fear-overlay" id="fear-overlay"></div>
    <div class="vignette"></div>
    <div class="breathing-overlay" id="breathing-overlay"></div>
    
    <!-- Jump Scare -->
    <div class="jump-scare" id="jump-scare">
        <div class="jump-scare-content">!</div>
    </div>

    <!-- Glitch Effect -->
    <div class="glitch" id="glitch-effect"></div>

    <!-- UI Elements -->
    <div id="controls-hint">
        WASD: Move | Mouse: Look | Shift: Sprint | F: Flashlight | C: Crouch | H: Heal
    </div>
    
    <button id="audio-toggle">🔊</button>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    
    <!-- Game Script -->
    <script>
        // Main game script - all in one for fast loading
        (function() {
            'use strict';
            
            // Main Game Class
            class EarsOfTheForest {
                constructor() {
                    // Core Three.js objects
                    this.scene = null;
                    this.camera = null;
                    this.renderer = null;
                    this.clock = null;
                    
                    // Game state
                    this.isRunning = false;
                    this.isPaused = false;
                    this.isInCutscene = false;
                    this.gameTime = 0;
                    this.timeOfDay = 0.25; // 6 AM
                    
                    // Camera controls
                    this.cameraRotation = { x: 0, y: 0 };
                    this.isPointerLocked = false;
                    this.sensitivity = 0.002;
                    
                    // Player state - ADDED HUNGER
                    this.player = {
                        health: 100,
                        maxHealth: 100,
                        stamina: 100,
                        maxStamina: 100,
                        battery: 100,
                        maxBattery: 100,
                        hunger: 100,       // NEW: Hunger meter
                        maxHunger: 100,
                        thirst: 100,       // NEW: Thirst meter
                        maxThirst: 100,
                        fear: 5,
                        maxFear: 100,
                        bodyTemp: 98.6,    // NEW: Body temperature
                        position: new THREE.Vector3(0, 1.7, 5),
                        velocity: new THREE.Vector3(),
                        onGround: true,
                        movementSpeed: 5,
                        sprintSpeed: 10,
                        crouchSpeed: 2,
                        currentSpeed: 5,
                        isCrouching: false,
                        isExhausted: false
                    };
                    
                    // Input state
                    this.keys = {};
                    this.input = {
                        forward: false,
                        backward: false,
                        left: false,
                        right: false,
                        sprint: false,
                        flashlight: true,
                        crouch: false,
                        jump: false
                    };
                    
                    // Story flags
                    this.story = {
                        exploredCave: false,
                        heartseedFound: false,
                        foundCompass: false,
                        foundMap: false,
                        helpedAlex: false
                    };
                    
                    // Inventory - ADDED NEW ITEMS
                    this.inventory = {
                        medkits: 1,
                        batteries: 2,
                        sticks: 0,
                        cloth: 0,
                        berries: 0,      // NEW: Edible berries
                        mushrooms: 0,    // NEW: Some edible, some poisonous
                        water: 0,        // NEW: Water canteen
                        rope: 0,         // NEW: Crafting material
                        compass: false,  // NEW: Navigation help
                        map: false       // NEW: Navigation help
                    };
                    
                    // World objects
                    this.trees = [];
                    this.wolves = [];
                    this.flashlight = null;
                    this.sunLight = null;
                    this.berries = [];    // NEW: Berry bushes
                    this.mushrooms = [];  // NEW: Mushroom patches
                    this.waterSources = []; // NEW: Streams/puddles
                    this.campfires = [];   // NEW: Can warm up at campfires
                    
                    // Audio
                    this.audioEnabled = true;
                    this.audioContext = null;
                    this.heartbeatOscillator = null;
                    
                    // UI elements cache
                    this.ui = {
                        healthFill: null,
                        staminaFill: null,
                        fearFill: null,
                        hungerFill: null,   // NEW: Hunger bar
                        thirstFill: null,   // NEW: Thirst bar
                        tempText: null,     // NEW: Temperature display
                        batteryText: null,
                        timeText: null
                    };
                    
                    // Game events
                    this.timedEvents = [
                        { time: 60, triggered: false, type: 'firstWolf' },
                        { time: 180, triggered: false, type: 'wolfPack' },
                        { time: 300, triggered: false, type: 'storm' },
                        { time: 600, triggered: false, type: 'nightFalls' }
                    ];
                    
                    // Weather system
                    this.weather = {
                        type: 'clear',
                        intensity: 0,
                        rainParticles: [],
                        fogIntensity: 0.01
                    };
                    
                    // Survival stats
                    this.stats = {
                        distanceTraveled: 0,
                        itemsCollected: 0,
                        wolvesEncountered: 0,
                        timeSurvived: 0
                    };
                }
                
                // ===============================
                // INITIALIZATION
                // ===============================
                
                init() {
                    console.log("🎮 Starting Ears of the Forest...");
                    
                    // Quick loading sequence
                    this.updateLoadingProgress("Loading engine...", 10);
                    
                    // Initialize everything quickly
                    setTimeout(() => {
                        this.initThreeJS();
                        this.updateLoadingProgress("Creating world...", 30);
                        
                        setTimeout(() => {
                            this.initWorld();
                            this.updateLoadingProgress("Adding survival elements...", 50);
                            
                            setTimeout(() => {
                                this.initUI();
                                this.updateLoadingProgress("Setting up controls...", 70);
                                
                                setTimeout(() => {
                                    this.initInput();
                                    this.updateLoadingProgress("Finalizing...", 90);
                                    
                                    setTimeout(() => {
                                        this.hideLoadingScreen();
                                        this.startOpeningCutscene();
                                        console.log("✅ Game loaded!");
                                    }, 100);
                                }, 100);
                            }, 100);
                        }, 100);
                    }, 100);
                }
                
                updateLoadingProgress(text, percent) {
                    const progressBar = document.getElementById('progress-bar');
                    const loadingText = document.getElementById('loading-text');
                    
                    if (progressBar) progressBar.style.width = percent + '%';
                    if (loadingText) loadingText.textContent = text;
                }
                
                hideLoadingScreen() {
                    const loadingScreen = document.getElementById('loading-screen');
                    const canvas = document.getElementById('game-canvas');
                    
                    if (loadingScreen) loadingScreen.style.display = 'none';
                    if (canvas) canvas.style.display = 'block';
                }
                
                // ===============================
                // THREE.JS INITIALIZATION
                // ===============================
                
                initThreeJS() {
                    try {
                        // Create scene with dark atmosphere
                        this.scene = new THREE.Scene();
                        this.scene.background = new THREE.Color(0x001a00);
                        this.scene.fog = new THREE.FogExp2(0x001a00, 0.01);
                        
                        // Create camera
                        this.camera = new THREE.PerspectiveCamera(
                            75,
                            window.innerWidth / window.innerHeight,
                            0.1,
                            1000
                        );
                        this.camera.position.copy(this.player.position);
                        
                        // Create renderer with performance settings
                        this.renderer = new THREE.WebGLRenderer({
                            canvas: document.getElementById('game-canvas'),
                            antialias: true,
                            powerPreference: "high-performance"
                        });
                        this.renderer.setSize(window.innerWidth, window.innerHeight);
                        this.renderer.shadowMap.enabled = true;
                        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                        
                        // Create clock for timing
                        this.clock = new THREE.Clock();
                        
                        // Handle window resize
                        window.addEventListener('resize', () => {
                            this.camera.aspect = window.innerWidth / window.innerHeight;
                            this.camera.updateProjectionMatrix();
                            this.renderer.setSize(window.innerWidth, window.innerHeight);
                        }, false);
                        
                        console.log("✅ Three.js initialized");
                    } catch (error) {
                        console.error("❌ Three.js failed:", error);
                        this.showError("Graphics initialization failed. Try refreshing.");
                    }
                }
                
                // ===============================
                // GAME WORLD
                // ===============================
                
                initWorld() {
                    // Enhanced lighting
                    const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
                    this.scene.add(ambientLight);
                    
                    const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x4f6b4f, 0.2);
                    this.scene.add(hemisphereLight);
                    
                    this.sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
                    this.sunLight.position.set(100, 200, 100);
                    this.sunLight.castShadow = true;
                    this.sunLight.shadow.mapSize.width = 1024;
                    this.sunLight.shadow.mapSize.height = 1024;
                    this.scene.add(this.sunLight);
                    
                    // Create detailed ground with texture
                    const groundGeometry = new THREE.PlaneGeometry(300, 300, 100, 100);
                    
                    // Add some terrain variation
                    const vertices = groundGeometry.attributes.position.array;
                    for (let i = 0; i < vertices.length; i += 3) {
                        const x = vertices[i];
                        const z = vertices[i + 2];
                        const distance = Math.sqrt(x * x + z * z);
                        const noise = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 2;
                        vertices[i + 1] = noise * (1 - Math.min(distance / 150, 1));
                    }
                    groundGeometry.computeVertexNormals();
                    
                    const groundMaterial = new THREE.MeshStandardMaterial({
                        color: 0x2d5a27,
                        roughness: 0.9,
                        metalness: 0.1
                    });
                    
                    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                    ground.rotation.x = -Math.PI / 2;
                    ground.position.y = -5;
                    ground.receiveShadow = true;
                    this.scene.add(ground);
                    
                    // Create dense forest
                    this.createForest(100);
                    
                    // Create winding path
                    this.createPath();
                    
                    // Create survival elements
                    this.createBerries(20);
                    this.createMushrooms(15);
                    this.createWaterSources(5);
                    this.createCampfires(3);
                    
                    // Create wolves
                    this.createWolves(5);
                    
                    // Create flashlight
                    this.createFlashlight();
                    
                    // Create cave entrance (for exploration)
                    this.createCave();
                    
                    // Add some fog particles for atmosphere
                    this.createAtmosphericFog();
                }
                
                createForest(count) {
                    const trunkMaterial = new THREE.MeshStandardMaterial({
                        color: 0x4a2e1f,
                        roughness: 0.8
                    });
                    
                    const leafMaterial = new THREE.MeshStandardMaterial({
                        color: 0x2f5f2f,
                        roughness: 0.9,
                        transparent: true,
                        opacity: 0.9
                    });
                    
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        const radius = 40 + Math.random() * 120;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        // Skip center area
                        if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
                        
                        // Variable tree sizes
                        const trunkHeight = 3 + Math.random() * 4;
                        const trunkRadius = 0.2 + Math.random() * 0.3;
                        const leavesRadius = 1.2 + Math.random() * 1.5;
                        
                        // Trunk
                        const trunkGeometry = new THREE.CylinderGeometry(
                            trunkRadius * 0.8,
                            trunkRadius,
                            trunkHeight,
                            8
                        );
                        const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                        trunk.position.set(x, trunkHeight / 2 - 5, z);
                        trunk.castShadow = true;
                        
                        // Leaves
                        const leavesGeometry = new THREE.SphereGeometry(leavesRadius, 6, 6);
                        const leaves = new THREE.Mesh(leavesGeometry, leafMaterial);
                        leaves.position.set(x, trunkHeight + leavesRadius * 0.5 - 5, z);
                        leaves.castShadow = true;
                        
                        this.scene.add(trunk);
                        this.scene.add(leaves);
                        
                        this.trees.push({
                            trunk,
                            leaves,
                            position: new THREE.Vector3(x, 0, z)
                        });
                    }
                }
                
                createPath() {
                    // Create a winding path using a curve
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(0, -4.9, 50),
                        new THREE.Vector3(20, -4.9, 20),
                        new THREE.Vector3(0, -4.9, -10),
                        new THREE.Vector3(-30, -4.9, -40),
                        new THREE.Vector3(0, -4.9, -80),
                        new THREE.Vector3(40, -4.9, -120),
                        new THREE.Vector3(0, -4.9, -160)
                    ]);
                    
                    const points = curve.getPoints(50);
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.LineBasicMaterial({ color: 0x8B4513 });
                    const pathLine = new THREE.Line(geometry, material);
                    this.scene.add(pathLine);
                }
                
                createBerries(count) {
                    const berryMaterial = new THREE.MeshStandardMaterial({
                        color: 0xff4444,
                        roughness: 0.5,
                        emissive: 0x330000,
                        emissiveIntensity: 0.1
                    });
                    
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 30 + Math.random() * 100;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        const berryGeometry = new THREE.SphereGeometry(0.2, 8, 8);
                        const berry = new THREE.Mesh(berryGeometry, berryMaterial);
                        berry.position.set(x, 0.2 - 5, z);
                        berry.castShadow = true;
                        
                        // Create bush
                        const bushGeometry = new THREE.SphereGeometry(0.5, 6, 6);
                        const bushMaterial = new THREE.MeshStandardMaterial({ color: 0x2E8B57 });
                        const bush = new THREE.Mesh(bushGeometry, bushMaterial);
                        bush.position.set(x, 0 - 5, z);
                        
                        this.scene.add(berry);
                        this.scene.add(bush);
                        
                        this.berries.push({
                            berry,
                            bush,
                            position: new THREE.Vector3(x, 0, z),
                            collected: false
                        });
                    }
                }
                
                createMushrooms(count) {
                    const mushroomColors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0x96ceb4];
                    
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 25 + Math.random() * 90;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        // Mushroom stem
                        const stemGeometry = new THREE.CylinderGeometry(0.1, 0.15, 0.3, 6);
                        const stemMaterial = new THREE.MeshStandardMaterial({ color: 0xf5deb3 });
                        const stem = new THREE.Mesh(stemGeometry, stemMaterial);
                        stem.position.set(x, 0.15 - 5, z);
                        
                        // Mushroom cap
                        const capGeometry = new THREE.SphereGeometry(0.2, 6, 6);
                        const capColor = mushroomColors[Math.floor(Math.random() * mushroomColors.length)];
                        const capMaterial = new THREE.MeshStandardMaterial({ 
                            color: capColor,
                            roughness: 0.7
                        });
                        const cap = new THREE.Mesh(capGeometry, capMaterial);
                        cap.position.set(x, 0.4 - 5, z);
                        cap.scale.set(1.5, 0.7, 1.5);
                        
                        this.scene.add(stem);
                        this.scene.add(cap);
                        
                        this.mushrooms.push({
                            stem,
                            cap,
                            position: new THREE.Vector3(x, 0, z),
                            collected: false,
                            isPoisonous: Math.random() < 0.3, // 30% chance of being poisonous
                            color: capColor
                        });
                    }
                }
                
                createWaterSources(count) {
                    const waterMaterial = new THREE.MeshStandardMaterial({
                        color: 0x1e90ff,
                        transparent: true,
                        opacity: 0.6,
                        roughness: 0.1,
                        metalness: 0.8
                    });
                    
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 40 + Math.random() * 80;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        const waterGeometry = new THREE.CircleGeometry(1 + Math.random(), 8);
                        const water = new THREE.Mesh(waterGeometry, waterMaterial);
                        water.rotation.x = -Math.PI / 2;
                        water.position.set(x, -4.9, z);
                        
                        this.scene.add(water);
                        
                        this.waterSources.push({
                            mesh: water,
                            position: new THREE.Vector3(x, 0, z),
                            waterAmount: 5 + Math.random() * 10
                        });
                    }
                }
                
                createCampfires(count) {
                    for (let i = 0; i < count; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 50 + Math.random() * 100;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        // Campfire logs
                        const logMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                        
                        for (let j = 0; j < 4; j++) {
                            const logGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1, 6);
                            const log = new THREE.Mesh(logGeometry, logMaterial);
                            log.rotation.x = Math.PI / 2;
                            log.rotation.z = (j * Math.PI / 2) + (Math.random() * 0.5);
                            log.position.set(x, -4.8, z);
                            log.position.x += Math.cos(j * Math.PI / 2) * 0.3;
                            log.position.z += Math.sin(j * Math.PI / 2) * 0.3;
                            
                            this.scene.add(log);
                        }
                        
                        // Fire pit
                        const pitGeometry = new THREE.CircleGeometry(0.4, 8);
                        const pitMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
                        const pit = new THREE.Mesh(pitGeometry, pitMaterial);
                        pit.rotation.x = -Math.PI / 2;
                        pit.position.set(x, -4.85, z);
                        
                        this.scene.add(pit);
                        
                        this.campfires.push({
                            position: new THREE.Vector3(x, 0, z),
                            active: Math.random() < 0.5,
                            warmth: 20
                        });
                    }
                }
                
                createWolves(count) {
                    const wolfMaterial = new THREE.MeshStandardMaterial({
                        color: 0x333333,
                        roughness: 0.9,
                        metalness: 0.1
                    });
                    
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        const radius = 50 + Math.random() * 80;
                        const x = Math.cos(angle) * radius;
                        const z = Math.sin(angle) * radius;
                        
                        // Wolf body
                        const bodyGeometry = new THREE.BoxGeometry(1.5, 0.8, 2.5);
                        const body = new THREE.Mesh(bodyGeometry, wolfMaterial);
                        body.position.set(x, 0.4 - 5, z);
                        body.castShadow = true;
                        
                        // Wolf head
                        const headGeometry = new THREE.BoxGeometry(0.8, 0.6, 0.8);
                        const head = new THREE.Mesh(headGeometry, wolfMaterial);
                        head.position.set(x, 0.8 - 5, z + 1.2);
                        
                        // Wolf legs
                        const legGeometry = new THREE.BoxGeometry(0.2, 0.8, 0.2);
                        const legs = [];
                        
                        for (let j = 0; j < 4; j++) {
                            const leg = new THREE.Mesh(legGeometry, wolfMaterial);
                            const legX = x + (j < 2 ? -0.4 : 0.4);
                            const legZ = z + (j % 2 ? -0.8 : 0.8);
                            leg.position.set(legX, 0 - 5, legZ);
                            legs.push(leg);
                            this.scene.add(leg);
                        }
                        
                        this.scene.add(body);
                        this.scene.add(head);
                        
                        this.wolves.push({
                            body,
                            head,
                            legs,
                            position: new THREE.Vector3(x, 0, z),
                            targetPosition: new THREE.Vector3(x, 0, z),
                            speed: 2 + Math.random(),
                            state: 'idle',
                            detectionRange: 15,
                            lastHowl: 0
                        });
                    }
                }
                
                createFlashlight() {
                    this.flashlight = new THREE.SpotLight(0xffffff, 2, 50, Math.PI / 6, 0.5, 1);
                    this.flashlight.position.set(0, 1.5, 0);
                    this.flashlight.target.position.set(0, 0, -10);
                    this.flashlight.castShadow = true;
                    
                    this.camera.add(this.flashlight);
                    this.camera.add(this.flashlight.target);
                    
                    // Flashlight casing (visual)
                    const casingGeometry = new THREE.CylinderGeometry(0.08, 0.1, 0.2, 8);
                    const casingMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
                    const casing = new THREE.Mesh(casingGeometry, casingMaterial);
                    casing.position.set(0.3, -0.3, -0.5);
                    this.camera.add(casing);
                }
                
                createCave() {
                    // Simple cave entrance
                    const caveMaterial = new THREE.MeshStandardMaterial({
                        color: 0x222222,
                        roughness: 1.0,
                        side: THREE.BackSide
                    });
                    
                    const caveGeometry = new THREE.CylinderGeometry(5, 3, 10, 16, 1, true);
                    const cave = new THREE.Mesh(caveGeometry, caveMaterial);
                    cave.position.set(60, -7, 60);
                    cave.rotation.x = Math.PI / 2;
                    
                    this.scene.add(cave);
                }
                
                createAtmosphericFog() {
                    // Add some floating particles for atmosphere
                    for (let i = 0; i < 50; i++) {
                        const geometry = new THREE.SphereGeometry(0.05, 4, 4);
                        const material = new THREE.MeshBasicMaterial({
                            color: 0xcccccc,
                            transparent: true,
                            opacity: 0.3
                        });
                        const particle = new THREE.Mesh(geometry, material);
                        
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 30 + Math.random() * 120;
                        const height = 2 + Math.random() * 8;
                        
                        particle.position.set(
                            Math.cos(angle) * radius,
                            height - 5,
                            Math.sin(angle) * radius
                        );
                        
                        this.scene.add(particle);
                    }
                }
                
                // ===============================
                // UI INITIALIZATION
                // ===============================
                
                initUI() {
                    const uiHTML = `
                        <!-- Health Display -->
                        <div class="health-container">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="color: #ff4444; font-size: 1rem;">❤️</span>
                                <span style="font-weight: bold; color: white;">HEALTH</span>
                            </div>
                            <div class="health-bar">
                                <div class="health-fill" id="health-fill"></div>
                            </div>
                            <div id="health-text" style="text-align: center; margin-top: 3px; font-size: 0.9rem; color: #ff4444;">100</div>
                        </div>
                        
                        <!-- Stamina Display -->
                        <div class="stamina-container">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="color: #ffaa00; font-size: 1rem;">⚡</span>
                                <span style="font-weight: bold; color: white;">STAMINA</span>
                            </div>
                            <div class="stamina-bar">
                                <div class="stamina-fill" id="stamina-fill"></div>
                            </div>
                        </div>
                        
                        <!-- Fear Display -->
                        <div class="fear-container">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="color: #aa44ff; font-size: 1rem;">😨</span>
                                <span style="font-weight: bold; color: white;">FEAR</span>
                            </div>
                            <div class="fear-bar">
                                <div class="fear-fill" id="fear-fill"></div>
                            </div>
                        </div>
                        
                        <!-- NEW: Hunger Display -->
                        <div class="hunger-container">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="color: #ff8800; font-size: 1rem;">🍎</span>
                                <span style="font-weight: bold; color: white;">HUNGER</span>
                            </div>
                            <div class="hunger-bar">
                                <div class="hunger-fill" id="hunger-fill"></div>
                            </div>
                        </div>
                        
                        <!-- NEW: Thirst Display -->
                        <div class="thirst-container">
                            <div style="display: flex; align-items: center; gap: 8px;">
