<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ears of the Forest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="health">Health: 100</div>
  <div id="compass">N</div>
  <div id="battery">Flashlight: 100%</div>
</div>

<div id="inventoryUI">Wood: 0 | Scrap: 0</div>
<div id="dialogue"></div>
<div id="choices"></div>
<div id="ending"></div>

<!-- Audio -->
<audio id="forest" src="audio/forest.mp3" loop></audio>
<audio id="howl" src="audio/wolf_howl.mp3"></audio>
<audio id="heartbeat" src="audio/heartbeat.mp3" loop></audio>
<audio id="creak" src="audio/creak.mp3"></audio>
<audio id="jumpScare" src="audio/jumpscare.mp3"></audio>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="script.js"></script>
</body>
</html>
