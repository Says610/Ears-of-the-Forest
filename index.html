<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
        </div>
        <h1 class="game-title">EARS OF THE FOREST</h1>
        <p class="game-subtitle">A Survival Horror Experience</p>
        
        <div class="loading-progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="loading-text" id="loading-text">Initializing...</div>
        <div class="loading-tip" id="loading-tip">Tip: Press F for flashlight</div>
        
        <!-- Emergency Skip Button -->
        <button id="emergency-skip" style="
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        ">EMERGENCY: SKIP LOADING</button>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Game Script -->
    <script src="script.js"></script>
</body>
</html>
