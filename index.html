<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
        </div>
        <h1 class="game-title">EARS OF THE FOREST</h1>
        <p class="game-subtitle">A Survival Horror Experience</p>
        
        <div class="loading-progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="loading-text" id="loading-text">Starting...</div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Game UI -->
    <div id="game-ui"></div>

    <!-- Visual Effects -->
    <div class="damage-flash" id="damage-flash"></div>
    <div class="fear-overlay" id="fear-overlay"></div>
    <div class="vignette"></div>
    
    <!-- Jump Scare -->
    <div class="jump-scare" id="jump-scare"></div>

    <!-- UI Elements -->
    <div id="controls-hint">
        WASD: Move | Mouse: Look | Shift: Sprint | F: Flashlight | C: Crouch | H: Heal
    </div>
    
    <button id="audio-toggle">🔊</button>

    <!-- Import Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Main Game Script -->
    <script src="game.js"></script>
</body>
</html>
