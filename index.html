<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    
    <!-- PointerLockControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <!-- Pointer Lock Overlay (shown when game starts) -->
    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 48px; margin-bottom: 20px;">EARS OF THE FOREST</h1>
            <p style="font-size: 24px; margin-bottom: 30px;">Click to play</p>
            <p>Move: WASD | Jump: SPACE | Sprint: SHIFT</p>
            <p>Flashlight: F | Medkit: H | Battery: B | Craft: C</p>
            <p style="margin-top: 30px; color: #ff6666;">Survive the wolves. Find your way out.</p>
        </div>
    </div>

    <!-- Dialogue Box -->
    <div id="dialogue" style="display: none;"></div>

    <!-- Main Game Script -->
    <script src="script.js"></script>
</body>
</html>
