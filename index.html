<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ears of the Forest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
<div id="controlsContainer">
  <span>Controls:</span>
  <div>W/A/S/D → Move</div>
  <div>Shift → Sprint</div>
  <div>Mouse → Look / Rotate</div>
  <div>F → Toggle Flashlight</div>
  <div>E → Interact / Collect / Craft</div>
  <div>1 → Use Bandage</div>
  <div>Esc → Pause / Skip Cutscene</div>
</div>

  </div>

  <!-- Audio Elements -->
  <audio id="forestAudio" src="assets/audio/forest.mp3" loop></audio>
  <audio id="howlAudio" src="assets/audio/wolf_howl.mp3"></audio>
  <audio id="jumpAudio" src="assets/audio/jump_scare.mp3"></audio>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
