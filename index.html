<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes of the Forest 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <div id="stats">
      <p>Hunger: <span id="hunger">100</span>%</p>
      <p>Thirst: <span id="thirst">100</span>%</p>
      <p>Temp: <span id="temperature">37</span>°C</p>
      <p>Stamina: <span id="stamina">100</span>%</p>
    </div>
    <div id="messages"></div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r153/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
