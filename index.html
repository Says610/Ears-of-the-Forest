<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ears of the Forest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div id="healthBarContainer">
      <div id="healthBar"></div>
    </div>
    <div id="batteryContainer">
      <div id="batteryLevel"></div>
    </div>
    <div id="inventoryUI">Inventory: Wood:0 | Scrap:0 | Bandage:0</div>
    <div id="mapUI">Map Placeholder</div>
    <div id="cutsceneOverlay"></div>
  </div>

  <!-- Audio Elements -->
  <audio id="forestAudio" loop>
    <source src="audio/forest_ambience.mp3" type="audio/mpeg">
  </audio>
  <audio id="jumpAudio">
    <source src="audio/jump_scare.mp3" type="audio/mpeg">
  </audio>
  <audio id="howlAudio">
    <source src="audio/wolf_howl.mp3" type="audio/mpeg">
  </audio>

  <!-- Three.js Renderer Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
