<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            cursor: none;
        }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(76, 175, 80, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Game Container */
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }
        
        /* Game UI */
        #game-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        /* Cinematic Bars */
        .cinematic-bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 100px;
            background: rgba(0,0,0,0.8);
            z-index: 1;
        }
        
        .cinematic-bar.top {
            top: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
        }
        
        .cinematic-bar.bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
        }
        
        /* Fade Effects */
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        /* Damage Flash */
        .damage-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,0,0,0.3);
            pointer-events: none;
            z-index: 99;
            opacity: 0;
        }
        
        /* Fear Effects */
        .fear-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(170,68,255,0.1) 100%);
            pointer-events: none;
            z-index: 98;
            opacity: 0;
            filter: blur(2px);
        }
        
        /* Instructions */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
            border: 1px solid #4CAF50;
            opacity: 0.8;
        }
        
        #instructions p {
            margin: 5px 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <!-- Howler.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    <!-- Simple Perlin Noise for Procedural Content -->
    <script src="https://cdn.jsdelivr.net/npm/perlin-noise@0.0.1/dist/perlin-noise.umd.min.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <h1 style="color: #4CAF50; margin-bottom: 10px; text-shadow: 0 0 10px #4CAF50;">Ears of the Forest</h1>
        <p style="color: #888; margin-bottom: 20px;">Loading immersive audio experience...</p>
        <div class="loading-progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p id="loading-text" style="color: #aaa; margin-top: 20px; font-size: 0.9rem;"></p>
    </div>

    <!-- Game Container -->
    <div id="game-container"></div>

    <!-- Game UI -->
    <div id="game-ui"></div>

    <!-- Effects -->
    <div class="damage-flash" id="damage-flash"></div>
    <div class="fear-effect" id="fear-effect"></div>

    <!-- Instructions -->
    <div id="instructions">
        <p>WASD: Move | Shift: Sprint | Mouse: Look | F: Flashlight</p>
        <p>E: Interact | H: Heal | C: Crouch | ESC: Pause</p>
    </div>

    <!-- Game Script -->
    <script src="script.js"></script>
</body>
</html>
