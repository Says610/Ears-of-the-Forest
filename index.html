<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ears of the Forest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="loading-content">
      <h1 class="loading-title">EARS OF THE FOREST</h1>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <p class="loading-text">Loading...</p>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div id="main-menu" class="overlay">
    <h1 class="menu-title">EARS OF THE FOREST</h1>
    <button id="new-game-btn">New Game</button>
    <button id="continue-btn">Continue</button>
    <button id="quit-btn">Quit</button>
  </div>

  <!-- INTRO CUTSCENE -->
  <div id="intro-cutscene" class="overlay hidden">
    <div class="cutscene-text">
      <p id="typewriter"></p>
    </div>
    <div id="click-to-start" class="hidden">Click to enter the forest</div>
  </div>

  <!-- GAME CANVAS -->
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="health-bar"><span>Health</span><div class="bar-bg"><div id="health-fill" class="bar-fill health"></div></div></div>
      <div class="fear-bar"><span>Fear</span><div class="bar-bg"><div id="fear-fill" class="bar-fill fear"></div></div></div>
      <div class="battery-bar"><span>Flashlight</span><div class="bar-bg"><div id="battery-fill" class="bar-fill battery"></div></div></div>
    </div>
    <div id="inventory-display">
      <span class="inv-item">Batteries: <span id="battery-count">0</span></span>
      <span class="inv-item">Medkits: <span id="medkit-count">0</span></span>
      <span class="inv-item">Survival Kits: <span id="survival-count">0</span></span>
    </div>
    <div id="dialogue-box">
      <p id="dialogue-text"></p>
    </div>
    <div id="choice-buttons"></div>
    <div id="compass">N</div>
  </div>

  <!-- PAUSE MENU -->
  <div id="pause-menu" class="overlay hidden">
    <h2 class="menu-title">Paused</h2>
    <button id="resume-btn">Resume</button>
    <button id="save-btn">Save Game</button>
    <button id="pause-quit-btn">Quit to Menu</button>
  </div>

  <!-- DEATH SCREEN -->
  <div id="death-screen" class="overlay hidden">
    <h2 class="menu-title death-title">You Have Died</h2>
    <p id="death-ending-text"></p>
    <button id="restart-btn">Try Again</button>
    <button id="death-quit-btn">Main Menu</button>
  </div>

  <!-- WIN SCREEN -->
  <div id="win-screen" class="overlay hidden">
    <h2 class="menu-title win-title">Escape</h2>
    <p id="win-ending-text"></p>
    <button id="win-restart-btn">Play Again</button>
    <button id="win-quit-btn">Main Menu</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
