<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ears of the Forest</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for visual cutscenes */
        .storyboard-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
        }
        
        .storyboard-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .storyboard-scene.active {
            opacity: 1;
        }
        
        .storyboard-image {
            width: 600px;
            height: 400px;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 2px solid rgba(76, 175, 80, 0.3);
        }
        
        .storyboard-text {
            max-width: 800px;
            font-size: 1.8rem;
            text-align: center;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            line-height: 1.6;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }
        
        .storyboard-character {
            font-size: 1.4rem;
            color: #4CAF50;
            font-style: italic;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            margin-top: 10px;
        }
        
        .storyboard-continue {
            position: absolute;
            bottom: 40px;
            color: #888;
            font-size: 1rem;
            animation: pulse 2s infinite;
            cursor: pointer;
        }
        
        .storyboard-progress {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .storyboard-progress-bar {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.5s ease;
        }
        
        /* Skip button */
        #skip-cutscene-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #888;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #444;
            cursor: pointer;
            z-index: 1001;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        #skip-cutscene-btn:hover {
            background: rgba(0,0,0,0.9);
            color: #ccc;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-container">
            <div class="loader"></div>
        </div>
        <h1 class="game-title">EARS OF THE FOREST</h1>
        <p class="game-subtitle">A Survival Horror Experience</p>
        
        <div class="loading-progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="loading-text" id="loading-text">Initializing...</div>
    </div>

    <!-- Storyboard Container for Visual Cutscenes -->
    <div id="storyboard-container" class="storyboard-container">
        <button id="skip-cutscene-btn">Skip Cutscene (ESC)</button>
        <div class="storyboard-progress">
            <div class="storyboard-progress-bar" id="storyboard-progress-bar"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Game UI -->
    <div id="game-ui"></div>

    <!-- Visual Effects -->
    <div class="damage-flash" id="damage-flash"></div>
    <div class="fear-overlay" id="fear-overlay"></div>
    <div class="vignette"></div>
    
    <!-- Jump Scare -->
    <div class="jump-scare" id="jump-scare"></div>

    <!-- Glitch Effect -->
    <div class="glitch" id="glitch-effect"></div>

    <!-- UI Elements -->
    <div id="controls-hint">
        WASD: Move | Mouse: Look | Shift: Sprint | F: Flashlight | C: Crouch | H: Heal
    </div>
    
    <button id="audio-toggle">🔊</button>

    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    
    <!-- Game Script -->
    <script>
        // Main game script - all in one file for fast loading
    </script>
</body>
</html>
