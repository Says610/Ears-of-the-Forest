<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ears of the Forest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="healthContainer">
      <span>Health</span>
      <div id="healthBar"></div>
    </div>
    <div id="batteryContainer">
      <span>Flashlight</span>
      <div id="batteryLevel"></div>
    </div>
    <div id="inventoryContainer">
      <span>Inventory</span>
      <div>Wood: <span id="inventoryWood">0</span></div>
      <div>Stick: <span id="inventoryStick">0</span></div>
      <div>Bandage: <span id="inventoryBandage">0</span></div>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="forestAudio" src="assets/audio/forest.mp3" loop></audio>
  <audio id="howlAudio" src="assets/audio/wolf_howl.mp3"></audio>
  <audio id="jumpAudio" src="assets/audio/jump_scare.mp3"></audio>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="script.js"></script>
</body>
</html>
